<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chẩn đoán Chuyển BTP</title>
<style>
:root{--teal:#0f766e;--green:#16a34a;--red:#dc2626;--amber:#d97706;--bg:#f1f5f9;--border:#e2e8f0;--muted:#64748b;}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:#0f172a;font-size:15px;}
.top{background:var(--teal);color:#fff;padding:14px;font-weight:700;font-size:17px;position:sticky;top:0;z-index:5;}
.wrap{padding:14px;max-width:900px;margin:0 auto;}
.btn{border:0;border-radius:10px;background:var(--teal);color:#fff;font-weight:700;font-size:16px;padding:14px;width:100%;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.5;}
.card{background:#fff;border:2px solid var(--border);border-radius:12px;padding:12px;margin-bottom:12px;}
.card h3{margin:0 0 8px;font-size:15px;}
.row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--border);font-size:14px;}
.row:last-child{border-bottom:0;}
.ms{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;}
.ok{color:var(--green);} .warn{color:var(--amber);} .bad{color:var(--red);}
pre{background:#0f172a;color:#e2e8f0;padding:10px;border-radius:10px;overflow:auto;font-size:11.5px;max-height:300px;white-space:pre-wrap;word-break:break-all;}
.big{font-size:20px;font-weight:800;}
.banner{padding:12px;border-radius:10px;margin-bottom:12px;font-weight:700;}
.banner.bad{background:#fef2f2;color:var(--red);border:2px solid var(--red);}
.banner.ok{background:#dcfce7;color:#15803d;border:2px solid var(--green);}
.hint{font-size:13px;color:var(--muted);margin-top:6px;font-weight:400;}
textarea{width:100%;height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;border:2px solid var(--border);border-radius:10px;padding:8px;}
</style>
</head>
<body>
<div class="top">🔬 Chẩn đoán Chuyển BTP</div>
<div class="wrap">

  <div id="banner"></div>

  <button id="btnRun" class="btn" onclick="chay()">▶️ CHẠY CHẨN ĐOÁN</button>
  <div class="hint">Chạy xong, bấm <b>Sao chép kết quả</b> ở cuối trang rồi gửi lại cho người hỗ trợ.</div>

  <div id="kq"></div>
</div>

<script>
const CONFIG = {
  APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbweJ234d0G0CTZfSwd21tX-EzWq29K-XHELqBh0ho0MQv2YMJ1-9nv0ZHz_Mv9_V_Ns/exec",
  // Phải khớp CBTP_VER trong Code_ThoiIn.gs. Lệch = chưa deploy lại Apps Script.
  VER_MONG_DOI: "2.2"
};

let _seq = 0;
function api(action, params, timeoutMs){
  return new Promise((resolve, reject) => {
    const cb = "__dbg_cb" + (++_seq);
    const s = document.createElement("script");
    const timer = setTimeout(() => { cleanup(); reject(new Error("HẾT GIỜ (" + (timeoutMs||60000)/1000 + "s)")); }, timeoutMs || 60000);
    function cleanup(){ clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = d => { cleanup(); resolve(d); };
    s.onerror = () => { cleanup(); reject(new Error("LỖI MẠNG / script không tải được")); };
    let url = CONFIG.APPS_SCRIPT_URL + "?action=" + action + "&callback=" + cb;
    if(params) for(const k in params){ if(params[k]) url += "&" + k + "=" + encodeURIComponent(params[k]); }
    url += "&t=" + Date.now();
    s.src = url;
    document.body.appendChild(s);
  });
}

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function mau(ms){ return ms < 1500 ? "ok" : ms < 4000 ? "warn" : "bad"; }
function homNay(){
  const n = new Date();
  return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");
}

let bienBan = [];
function log(s){ bienBan.push(s); }

async function doThoiGian(ten, action, params, timeout){
  const t0 = performance.now();
  try{
    const r = await api(action, params, timeout);
    const ms = Math.round(performance.now() - t0);
    return { ten, ms, r, loi: null };
  }catch(e){
    const ms = Math.round(performance.now() - t0);
    return { ten, ms, r: null, loi: e.message };
  }
}

function theKetQua(k){
  let h = '<div class="card"><h3>' + esc(k.ten) + '</h3>';
  h += '<div class="row"><span>Thời gian trọn vòng</span><span class="ms ' + mau(k.ms) + '">' + k.ms + ' ms</span></div>';
  if(k.loi){
    h += '<div class="row"><span>Kết quả</span><span class="ms bad">' + esc(k.loi) + '</span></div>';
  } else {
    h += '<div class="row"><span>result</span><span class="ms ' + (k.r.result==="ok"?"ok":"bad") + '">' + esc(k.r.result) + '</span></div>';
    if(k.r.ver) h += '<div class="row"><span>Phiên bản backend</span><span class="ms ' + (k.r.ver===CONFIG.VER_MONG_DOI?"ok":"bad") + '">' + esc(k.r.ver) + '</span></div>';
  }
  h += '<pre>' + esc(JSON.stringify(k.r || {loi:k.loi}, null, 1).slice(0, 4000)) + '</pre></div>';
  return h;
}

async function chay(){
  const btn = document.getElementById("btnRun");
  btn.disabled = true; btn.textContent = "Đang đo...";
  document.getElementById("kq").innerHTML = "";
  document.getElementById("banner").innerHTML = "";
  bienBan = [];
  log("=== CHẨN ĐOÁN CHUYỂN BTP — " + new Date().toLocaleString("vi-VN") + " ===");

  const ds = [];

  // 1. Ping — đo từng lệnh phía server
  ds.push(await doThoiGian("1. Ping server (đo từng lệnh Sheets)", "tksxTransferPing", {}, 60000));
  // 2. Danh mục công đoạn / mục đích
  ds.push(await doThoiGian("2. Tải danh mục (tksxTransferRoutes)", "tksxTransferRoutes", {}, 60000));
  // 3. Tra cứu hôm nay
  ds.push(await doThoiGian("3. Tra cứu HÔM NAY", "tksxTransferHistory",
          { date: homNay(), dateTo: homNay() }, 60000));
  // 4. Tra cứu KHÔNG lọc ngày (lấy hết)
  ds.push(await doThoiGian("4. Tra cứu KHÔNG lọc gì (lấy hết)", "tksxTransferHistory", {}, 60000));
  // 5. Gọi lại lần 2 để xem cache có ăn không
  ds.push(await doThoiGian("5. Tra cứu HÔM NAY lần 2 (kiểm tra cache)", "tksxTransferHistory",
          { date: homNay(), dateTo: homNay() }, 60000));
  // 6. Chẩn đoán Master Sheet
  ds.push(await doThoiGian("6. Chẩn đoán Master Sheet", "tksxTransferDebug", {}, 60000));

  let html = "";

  // ── Bảng tổng hợp thời gian phía SERVER (từ ping) ──
  const ping = ds[0].r;
  if(ping && ping.buocs){
    html += '<div class="card"><h3>⏱️ Thời gian TỪNG LỆNH phía server</h3>';
    ping.buocs.forEach(b => {
      html += '<div class="row"><span>' + esc(b.buoc) + '</span><span class="ms ' + mau(b.ms) + '">' + b.ms + ' ms</span></div>';
    });
    html += '<div class="row"><span class="big">TỔNG code chạy trên server</span><span class="ms big ' + mau(ping.tongMs) + '">' + ping.tongMs + ' ms</span></div>';

    // ── SỐ QUAN TRỌNG NHẤT ──
    // Chênh lệch = (thời gian trình duyệt chờ) − (thời gian code thật sự chạy).
    // Phần này KHÔNG phải do code chậm, mà là: Apps Script nạp lại toàn bộ file
    // .gs mỗi lần gọi (cold start), request bị XẾP HÀNG sau một lượt chạy nền
    // đang chiếm script, và độ trễ mạng.
    const ngoai = ds[0].ms - ping.tongMs;
    html += '<div class="row"><span class="big">Chi phí NGOÀI code<div class="hint">cold start + xếp hàng + mạng</div></span>' +
            '<span class="ms big ' + mau(ngoai) + '">' + ngoai + ' ms</span></div>';
    if(ngoai > 5000){
      html += '<div class="hint" style="color:var(--red);font-weight:700">' +
              '→ Phần lớn thời gian KHÔNG nằm ở code xử lý. Nguyên nhân thường gặp: ' +
              'một tác vụ nền (warmup) đang chạy và chiếm Apps Script, request phải xếp hàng chờ.</div>';
    }
    html += '<div class="row"><span>Tab ChuyenBTP_Cat</span><span class="ms">' + (ping.coTabChuyenBTP ? (ping.soDong + " dòng × " + ping.soCot + " cột") : "KHÔNG TÌM THẤY") + '</span></div>';
    html += '<div class="row"><span>MA_PhongBan</span><span class="ms">' + esc(ping.maPhongBan) + '</span></div>';
    html += '<div class="row"><span>TransferType_Master</span><span class="ms">' + esc(ping.transferTypeMaster) + '</span></div>';
    html += '</div>';
  }

  // ── Banner kết luận ──
  let ket = [];
  const verServer = (ping && ping.ver) || (ds[1].r && ds[1].r.ver);
  if(!verServer){
    ket.push("❌ Backend CHƯA ĐƯỢC DEPLOY LẠI — server không trả về số phiên bản. Vào Apps Script → Deploy → Manage deployments → Edit → Version: New version.");
  } else if(verServer !== CONFIG.VER_MONG_DOI){
    ket.push("❌ LỆCH PHIÊN BẢN: server đang chạy " + verServer + ", bản mới là " + CONFIG.VER_MONG_DOI + ". Phải deploy lại Apps Script.");
  }
  const dm = ds[1].r;
  if(dm && dm.result === "ok"){
    if(!dm.congDoans || !dm.congDoans.length) ket.push("❌ Danh mục CÔNG ĐOẠN rỗng — kiểm tra tab MA_PhongBan / MA_MAY.");
    if(!dm.transferTypes || !dm.transferTypes.length) ket.push("❌ Danh mục MỤC ĐÍCH rỗng.");
  }
  const tra = ds[3].r;
  if(tra && tra.result === "ok" && tra.total === 0 && ping && ping.soDong > 0){
    ket.push("⚠️ Sheet có " + ping.soDong + " dòng nhưng tra cứu KHÔNG lọc gì vẫn ra 0 — nghi cột Status không phải 'Completed' hoặc cột ngày sai định dạng. Xem mục 'baDongCuoi' ở bước 1.");
  }
  ds.forEach(k => { if(k.ms > 8000) ket.push("⚠️ Bước " + k.ten + " mất " + k.ms + " ms."); });

  document.getElementById("banner").innerHTML = ket.length
    ? '<div class="banner bad">' + ket.map(esc).join("<br/>") + '</div>'
    : '<div class="banner ok">✅ Không phát hiện bất thường. Nếu vẫn chậm, gửi biên bản bên dưới.</div>';

  ds.forEach(k => { html += theKetQua(k); });

  // ── Biên bản để copy ──
  log("URL: " + CONFIG.APPS_SCRIPT_URL);
  log("Phiên bản frontend mong đợi: " + CONFIG.VER_MONG_DOI + " | server trả: " + (verServer || "KHÔNG CÓ"));
  ds.forEach(k => log("[" + k.ms + " ms] " + k.ten + " → " + (k.loi ? "LỖI: " + k.loi : JSON.stringify(k.r).slice(0, 1500))));
  ket.forEach(x => log("KẾT LUẬN: " + x));

  html += '<div class="card"><h3>📋 Biên bản (gửi lại cho người hỗ trợ)</h3>' +
          '<textarea id="bb" readonly>' + esc(bienBan.join("\n")) + '</textarea>' +
          '<button class="btn" style="margin-top:8px" onclick="copyBB()">Sao chép kết quả</button></div>';

  document.getElementById("kq").innerHTML = html;
  btn.disabled = false; btn.textContent = "▶️ CHẠY LẠI";
}

function copyBB(){
  const t = document.getElementById("bb");
  t.select(); t.setSelectionRange(0, 999999);
  try{ document.execCommand("copy"); alert("Đã sao chép. Dán vào chat để gửi."); }
  catch(e){ alert("Không sao chép được, bạn chọn tay trong ô rồi copy nhé."); }
}
</script>
</body>
</html>
