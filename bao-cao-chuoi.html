<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kiểm tra tiến độ đơn hàng — QA-P.ERP</title>
<style>
:root{
  --teal:#0f766e; --teal-d:#0b5b54; --green:#16a34a; --red:#dc2626;
  --amber:#d97706; --txt:#1e293b; --muted:#64748b; --border:#e2e8f0; --bg:#f1f5f9;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
body{background:var(--bg);color:var(--txt);}

/* topbar */
.topbar{position:sticky;top:0;z-index:10;background:var(--teal);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 12px;}
.topbar .ttl{font-size:15px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.icon-btn{background:rgba(255,255,255,.15);border:none;color:#fff;font-size:17px;width:36px;height:36px;border-radius:10px;cursor:pointer;flex-shrink:0;}

/* search area */
.search-area{padding:10px 12px 6px;background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:49px;z-index:9;}
.search-row{display:flex;gap:8px;margin-bottom:6px;}
.search-box{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:15px;background:#fff;min-width:0;}
.search-box:focus{outline:none;border-color:var(--teal);}

/* chips */
.sum-chips{display:flex;gap:6px;flex-wrap:wrap;padding:6px 12px;}
/* Chip = nút lọc (bấm được từ 03/08/2026). Trước đây chỉ hiển thị số. */
.chip{font-size:11px;font-weight:700;padding:4px 11px;border-radius:10px;
  border:2px solid transparent;cursor:pointer;font-family:inherit;line-height:1.3;
  transition:transform .08s;}
.chip:active{transform:scale(.96);}
.chip.total{background:#e0f2fe;color:#0369a1;}
.chip.du{background:#dcfce7;color:#15803d;}
.chip.thieu{background:#fef3c7;color:#92400e;}
.chip.chuasx{background:#f1f5f9;color:#64748b;}
/* Chip đang được chọn — viền đậm + dấu tick */
.chip.on{border-color:currentColor;box-shadow:0 1px 4px rgba(0,0,0,.12);}
.chip.on::before{content:"\2713 ";font-weight:900;}

/* nút Tìm (thêm 03/08/2026 — trước đây lọc tự động theo từng ký tự gõ) */
.btn-row{display:flex;gap:8px;margin-top:8px;}
.btn-find{flex:2;padding:11px;border:0;border-radius:10px;background:var(--teal);color:#fff;
  font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;}
.btn-find:active{transform:scale(.98);}
.btn-clear-all{flex:1;padding:11px;border:2px solid var(--border);border-radius:10px;
  background:var(--card);color:var(--muted);font-size:14px;font-weight:600;
  font-family:inherit;cursor:pointer;}
.btn-clear-all:active{transform:scale(.98);}

/* status */
.hint{padding:10px 14px;border-radius:10px;font-size:14px;text-align:center;margin:8px 12px;}
.hint.info{background:#e0f2fe;color:#0369a1;}
.hint.err{background:#fef2f2;color:var(--red);}

/* cards */
.wrap{padding:8px 12px 20px;}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px;transition:border-color .15s;cursor:pointer;}
.card:active{border-color:var(--teal);}
.card-head{display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
.c-lsx{font-weight:800;font-size:14px;word-break:break-all;font-family:ui-monospace,Consolas,monospace;color:var(--teal-d);}
.c-kh{font-size:12px;color:var(--txt);font-weight:600;margin-left:auto;text-align:right;max-width:45%;}
.c-meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted);margin-bottom:8px;}
.c-meta b{color:var(--txt);}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:7px;white-space:nowrap;}
.b-du{background:#dcfce7;color:#15803d;}
.b-thieu{background:#fef3c7;color:#92400e;}
.b-none{background:#f1f5f9;color:#94a3b8;}

/* stages */
.stages{display:flex;flex-direction:column;gap:4px;}
.stage{display:flex;align-items:center;gap:6px;font-size:12px;}
.s-name{width:70px;color:var(--muted);flex-shrink:0;font-weight:600;font-size:11px;}
.s-bar{flex:1;height:7px;background:#f1f5f9;border-radius:5px;overflow:hidden;}
.s-fill{height:100%;border-radius:5px;transition:width .3s;}
.s-fill.green{background:var(--green);}
.s-fill.teal{background:var(--teal);}
.s-fill.amber{background:var(--amber);}
.s-fill.red{background:var(--red);}
.s-val{width:130px;text-align:right;font-weight:600;font-size:11px;flex-shrink:0;}
.s-val small{color:var(--muted);font-weight:400;}
.s-pct{font-size:10px;font-weight:700;width:38px;text-align:right;flex-shrink:0;}

/* ygh */
.ygh-row{margin-top:6px;font-size:11px;color:var(--muted);word-break:break-all;}
.ygh-row b{color:var(--teal);}

.empty{text-align:center;color:var(--muted);padding:30px 0;font-size:14px;}
.more-note{text-align:center;color:var(--muted);font-size:12px;margin:8px 0 16px;}

/* spinner */
.spin{display:inline-block;width:16px;height:16px;border:3px solid rgba(15,118,110,.25);border-top-color:var(--teal);border-radius:50%;animation:sp .6s linear infinite;vertical-align:middle;}
@keyframes sp{to{transform:rotate(360deg)}}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#111827;color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:99;max-width:90vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* progress bar top */
.load-bar{height:3px;background:transparent;position:fixed;top:49px;left:0;right:0;z-index:11;}
.load-bar.active{background:linear-gradient(90deg,transparent,var(--teal),transparent);animation:loadSlide 1.5s infinite;}
@keyframes loadSlide{0%{background-position:-200px 0}100%{background-position:200px 0}}

/* ═══ MODAL ═══ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal{background:#fff;width:100%;max-width:600px;max-height:92vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:slideUp .25s ease-out;}
@keyframes slideUp{from{transform:translateY(40%);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-head{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--border);flex-shrink:0;}
.modal-head .m-title{flex:1;font-weight:800;font-size:15px;color:var(--teal-d);font-family:ui-monospace,Consolas,monospace;word-break:break-all;}
.modal-head .m-close{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:8px;}
.modal-head .m-close:active{background:var(--bg);}
.modal-body{overflow-y:auto;padding:12px 16px 24px;flex:1;}

/* detail sections */
.det-section{margin-bottom:16px;}
.det-title{font-size:13px;font-weight:700;color:var(--teal);padding:6px 0;border-bottom:1px solid var(--border);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.det-title .dt-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--muted);}
.det-summary{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-bottom:8px;padding:6px 10px;background:var(--bg);border-radius:8px;}
.det-summary b{color:var(--txt);}
.det-day{border:1px solid var(--border);border-radius:10px;margin-bottom:6px;overflow:hidden;}
.det-day-head{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fafbfc;cursor:pointer;font-size:12px;user-select:none;}
.det-day-head:active{background:#f1f5f9;}
.det-day-head .dd-date{font-weight:700;color:var(--txt);}
.det-day-head .dd-info{flex:1;color:var(--muted);font-size:11px;}
.det-day-head .dd-kg{font-weight:700;font-size:12px;color:var(--teal-d);}
.det-day-head .dd-arrow{color:var(--muted);font-size:14px;transition:transform .2s;}
.det-day.open .dd-arrow{transform:rotate(90deg);}
.det-day-rows{display:none;padding:4px 12px 8px;}
.det-day.open .det-day-rows{display:block;}
.det-row{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #f1f5f9;font-size:11px;flex-wrap:wrap;}
.det-row:last-child{border-bottom:none;}
.det-row .dr-time{color:var(--muted);width:46px;flex-shrink:0;}
.det-row .dr-cn{font-weight:600;color:var(--txt);}
.det-row .dr-may{color:var(--teal);font-size:10px;}
.det-row .dr-val{margin-left:auto;font-weight:700;font-size:12px;white-space:nowrap;}
.det-row .dr-cuon{color:var(--muted);font-size:10px;margin-left:4px;}
.det-loading{text-align:center;padding:20px;color:var(--muted);font-size:13px;}
.det-empty{text-align:center;padding:12px;color:#cbd5e1;font-size:12px;}

/* KH clear button */
.search-wrap{position:relative;flex:1;min-width:0;}
.search-wrap .clear-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer;padding:2px 6px;display:none;}
.search-wrap .clear-btn.show{display:block;}
</style>
</head>
<body>

<div class="topbar">
  <button class="icon-btn" onclick="goHome()">&#8592;</button>
  <div class="ttl">&#128203; Kiểm tra tiến độ đơn hàng</div>
  <button class="icon-btn" onclick="loadAll(true)" title="Tải lại">&#128260;</button>
  <button class="icon-btn" onclick="goHome()" title="Trang chủ">&#127968;</button>
</div>
<div class="load-bar" id="loadBar"></div>

<div class="search-area">
  <div class="search-row" style="flex-direction:column;">
    <div class="search-wrap">
      <input id="qKH" class="search-box" type="text" placeholder="Khách hàng..."
             oninput="toggleClear()" onkeydown="if(event.key==='Enter')doSearch()" style="padding-right:32px;">
      <button class="clear-btn" id="qKH_clr" onclick="xoaO('qKH')">&times;</button>
    </div>
    <div class="search-wrap">
      <input id="q" class="search-box" type="text" placeholder="LSX / Mã SP..."
             oninput="toggleClear()" onkeydown="if(event.key==='Enter')doSearch()" style="padding-right:32px;">
      <button class="clear-btn" id="q_clr" onclick="xoaO('q')">&times;</button>
    </div>
    <div class="btn-row">
      <button class="btn-find" onclick="doSearch()">&#128269; Tìm</button>
      <button class="btn-clear-all" onclick="xoaTatCa()">Xóa lọc</button>
    </div>
  </div>
</div>

<div class="sum-chips" id="chips" style="display:none"></div>
<div id="status" class="hint info">Đang tải dữ liệu...</div>
<div class="wrap" id="list"></div>

<div id="toast" class="toast"></div>

<!-- ═══ MODAL CHI TIẾT ═══ -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-head">
      <span class="m-title" id="mTitle"></span>
      <button class="m-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="mBody">
      <div class="det-loading"><span class="spin"></span> Đang tải chi tiết...</div>
    </div>
  </div>
</div>

<script>
const CONFIG = {
  CENTRAL_URL: "https://script.google.com/macros/s/AKfycbweJ234d0G0CTZfSwd21tX-EzWq29K-XHELqBh0ho0MQv2YMJ1-9nv0ZHz_Mv9_V_Ns/exec",
  TKSX_URL: "https://script.google.com/macros/s/AKfycbztgdaMXNFinyvZWXeO18tGHFFUKXW6V0XvvbWNR71L311WnsbVVWDreYSuLsdpZnrsiA/exec",
  RENDER_LIMIT: 150,
  CACHE_KEY: "tddh_cache_v3",     // đổi v2→v3: cấu trúc đệm đã thay đổi (03/08/2026)
  CACHE_TTL: 5 * 60 * 1000,
  // Giới hạn thời gian chờ (ms) — trước đây fetch không có timeout nên có thể treo vô hạn.
  // chainAll khi cache máy chủ nguội có thể mất 40-60 giây, nên để rộng.
  TIMEOUT_CHAIN:  75000,
  TIMEOUT_MASTER: 30000,
  TIMEOUT_DETAIL: 30000
};

/* ═══ STATE ═══ */
let data = [];
let customers = [];
let loading = false;
/* Bộ lọc theo tình trạng — thêm 03/08/2026.
   Giá trị: "all" | "du" | "thieu" | "chuasx" (khớp mã trả về của getStatus). */
let stFilter = "all";

/* ═══ SESSION ═══ */
function checkSession(){
  try{
    const s = JSON.parse(localStorage.getItem("ghinhan_session") || "null");
    return !!(s && s.username && s.ts && (Date.now() - s.ts < 8*3600*1000));
  }catch(e){ return false; }
}
function goHome(){ window.location.href = "index.html"; }

function showToast(msg, dur){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("show"), dur || 3000);
}

/* ═══ JSONP ═══ */
let jsonpSeq = 0;
function jsonp(url, timeoutMs){
  return new Promise((resolve, reject)=>{
    const cb = "__tddh_cb" + (++jsonpSeq);
    const s = document.createElement("script");
    const timer = setTimeout(()=>{ cleanup(); reject(new Error("timeout")); }, timeoutMs || 30000);
    function cleanup(){ clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = d => { cleanup(); resolve(d); };
    s.onerror = () => { cleanup(); reject(new Error("network")); };
    s.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cb + "&t=" + Date.now();
    document.body.appendChild(s);
  });
}

/* ═══ BASE LSX (bỏ tiền tố bù N1-/B2-...) ═══ */
function baseLSX(lsx){
  const s = String(lsx || "").trim();
  const m = /^[A-Za-z]\d-(.+)$/.exec(s);
  return m ? m[1] : s;
}
function isThoi(loai){ return String(loai||"").toUpperCase().includes("TH"); }

/* ═══ LOAD DATA ═══ */
function setLoading(on){
  document.getElementById("loadBar").className = "load-bar" + (on ? " active" : "");
}

async function loadAll(force){
  if(loading) return;
  loading = true;
  const st = document.getElementById("status");
  st.style.display = ""; st.className = "hint info";
  st.innerHTML = '<span class="spin"></span> Đang tải dữ liệu...';
  setLoading(true);

  if(!force){
    try{
      const c = JSON.parse(localStorage.getItem(CONFIG.CACHE_KEY) || "null");
      if(c && c.ts && c.data){
        data = c.data;
        customers = c.customers || [];
        st.style.display = "none";
        render();
        if(Date.now() - c.ts < CONFIG.CACHE_TTL){
          loading = false;
          setLoading(false);
          return;
        }
      }
    }catch(e){}
  }

  // SỬA 03/08/2026 — xem ghi chú ở đầu hàm jsonp() về 4 vấn đề đã khắc phục.
  // Dùng allSettled thay Promise.all: một nguồn hỏng KHÔNG làm hỏng cả trang.
  const [rCentral, rTksx] = await Promise.allSettled([
    jsonp(CONFIG.CENTRAL_URL + "?action=chainAll", CONFIG.TIMEOUT_CHAIN),
    jsonp(CONFIG.TKSX_URL + "?action=masterall",   CONFIG.TIMEOUT_MASTER)
  ]);

  const central = rCentral.status === "fulfilled" ? rCentral.value : null;
  const tksx    = rTksx.status    === "fulfilled" ? rTksx.value    : { rows: [] };

  if(central && central.orders){
    mergeData(central, tksx);
    luuCache();
    st.style.display = "none";
    render();
    // Thổi/In hỏng nhưng TP vẫn có → báo nhẹ, không chặn
    if(rTksx.status === "rejected"){
      showToast("Không tải được dữ liệu Thổi/In (" + moTaLoi(rTksx.reason) + ") — cột Thổi/In sẽ trống", 4000);
    }
  } else {
    // Nguồn chính hỏng
    const ly = moTaLoi(rCentral.reason);
    if(!data.length){
      st.className = "hint err";
      st.innerHTML = "Không tải được dữ liệu — <b>" + esc(ly) + "</b>.<br>" +
        'Bấm <b>Tải lại</b> (🔄 góc trên) hoặc <b>Kiểm tra kết nối</b> để xem chi tiết.';
    } else {
      st.style.display = "none";
      showToast("Lỗi cập nhật (" + ly + ") — đang hiện dữ liệu đã lưu", 4000);
    }
  }
  loading = false;
  setLoading(false);
}

/** Diễn giải lỗi thành câu người dùng hiểu được. */
function moTaLoi(err){
  const m = String((err && err.message) || err || "không rõ");
  if(m === "timeout") return "máy chủ không trả lời trong " + (CONFIG.TIMEOUT_CHAIN/1000) + " giây";
  if(m === "network") return "không kết nối được máy chủ";
  return m;
}

/**
 * Lưu bộ nhớ đệm trên máy — CHỈ các trường cần cho danh sách.
 *
 * SỬA 03/08/2026: trước đây lưu nguyên `data` (~6,1 MB) trong khi giới hạn
 * localStorage chỉ ~5 MB. Lệnh setItem ném QuotaExceededError và bị catch rỗng
 * nuốt mất → bộ đệm KHÔNG BAO GIỜ hoạt động, mỗi lần mở trang đều tải lại 6 MB.
 *
 * Nay chỉ lưu 15 trường thực sự dùng để vẽ danh sách (bỏ ygh, dvt và các trường
 * chỉ dùng trong modal chi tiết — modal vốn gọi API riêng). Kích thước xuống ~2 MB.
 * Nếu vẫn quá dung lượng thì xóa đệm và báo, không im lặng.
 */
function luuCache(){
  try{
    const gon = data.map(e => ({
      lsx:e.lsx, lsxct:e.lsxct, kh:e.kh, masp:e.masp, mota:e.mota, cl:e.cl, ng:e.ng,
      slYC:e.slYC, klYC:e.klYC, slDone:e.slDone, klDone:e.klDone,
      thoi:e.thoi, in:e.in
    }));
    localStorage.setItem(CONFIG.CACHE_KEY, JSON.stringify({
      ts: Date.now(), data: gon, customers: customers
    }));
  }catch(e){
    // Hết dung lượng — dọn đệm cũ để lần sau không lỗi tiếp, và cho biết
    try{ localStorage.removeItem(CONFIG.CACHE_KEY); }catch(e2){}
    console.warn("Không lưu được bộ đệm:", e && e.name, e && e.message);
  }
}

function mergeData(central, tksx){
  const btpMap = {};
  (tksx.rows || []).forEach(r => {
    const key = baseLSX(r.lsxGoc || r.lsx);
    if(!btpMap[key]) btpMap[key] = {
      thoi: {klyc:0, sx:0}, in: {klyc:0, sx:0}
    };
    const t = isThoi(r.loai) ? btpMap[key].thoi : btpMap[key].in;
    t.klyc += parseFloat(r.klyc) || 0;
    t.sx   += parseFloat(r.tongSX) || 0;
  });

  const orders = central.orders || [];
  customers = central.customers || [];

  const grouped = {};
  orders.forEach(o => {
    const key = baseLSX(o.lsxct || o.lsx);
    if(!key) return;
    if(!grouped[key]){
      grouped[key] = {
        lsx: key, lsxct: o.lsxct || "",
        kh: o.kh || "", masp: o.masp || "", mota: o.mota || "",
        cl: o.cl || "", dvt: o.dvt || "", ng: o.ng || "",
        slYC: 0, klYC: 0, slDone: 0, klDone: 0,
        thoi: {klyc:0, sx:0}, in: {klyc:0, sx:0}, ygh: []
      };
    }
    const g = grouped[key];
    g.slYC += o.slYC || 0;
    g.klYC += o.klYC || 0;
    g.slDone += o.slDone || 0;
    g.klDone += o.klDone || 0;
    if(!g.kh && o.kh) g.kh = o.kh;
    if(!g.masp && o.masp) g.masp = o.masp;
    if(!g.mota && o.mota) g.mota = o.mota;
    if(!g.cl && o.cl) g.cl = o.cl;
    if(!g.dvt && o.dvt) g.dvt = o.dvt;
    if(!g.ng && o.ng) g.ng = o.ng;
  });

  Object.keys(grouped).forEach(key => {
    const btp = btpMap[key];
    if(btp){
      grouped[key].thoi = btp.thoi;
      grouped[key].in = btp.in;
    }
  });

  Object.keys(btpMap).forEach(key => {
    if(!grouped[key]){
      grouped[key] = {
        lsx: key, lsxct: "", kh: "", masp: "", mota: "", cl: "", dvt: "", ng: "",
        slYC: 0, klYC: 0, slDone: 0, klDone: 0,
        thoi: btpMap[key].thoi, in: btpMap[key].in, ygh: []
      };
    }
  });

  data = Object.values(grouped);
  data.sort((a,b) => String(b.lsx).localeCompare(String(a.lsx), undefined, {numeric:true}));
}

/* ═══ RENDER ═══ */
/* ══════════════════════════════════════════════
   TÌM KIẾM — bấm nút thay vì lọc theo từng ký tự
   Thêm 03/08/2026.

   Trước đây mỗi ký tự gõ vào đều kích hoạt render() sau 200ms. Với hơn 24.000
   dòng, mỗi lần render phải duyệt toàn bộ danh sách rồi dựng lại HTML —
   trên điện thoại gõ vài chữ là giật.

   Nay chỉ lọc khi người dùng bấm Tìm hoặc nhấn Enter. Từ khóa đang áp dụng
   được giữ trong qApplied / qKHApplied, tách khỏi nội dung đang gõ trong ô,
   để bấm chip lọc tình trạng không vô tình áp dụng chữ chưa tìm.
══════════════════════════════════════════════ */

let qApplied   = "";   // từ khóa LSX / Mã SP đang áp dụng
let qKHApplied = "";   // từ khóa Khách hàng đang áp dụng

/** Hiện/ẩn dấu × trong ô nhập. Chạy mỗi lần gõ — nhẹ, không đụng danh sách. */
function toggleClear(){
  document.getElementById("qKH_clr").classList.toggle("show", !!document.getElementById("qKH").value);
  document.getElementById("q_clr").classList.toggle("show", !!document.getElementById("q").value);
}

/** Bấm nút Tìm hoặc nhấn Enter → áp dụng từ khóa rồi vẽ lại danh sách. */
function doSearch(){
  qApplied   = (document.getElementById("q").value   || "").trim().toLowerCase();
  qKHApplied = (document.getElementById("qKH").value || "").trim().toLowerCase();
  toggleClear();
  render();
  // Đóng bàn phím trên điện thoại cho dễ xem kết quả
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
}

/** Dấu × trong một ô — xóa ô đó rồi tìm lại ngay. */
function xoaO(id){
  document.getElementById(id).value = "";
  doSearch();
}

/** Nút "Xóa lọc" — xóa cả 2 ô nhập lẫn bộ lọc tình trạng, về xem tất cả. */
function xoaTatCa(){
  document.getElementById("q").value = "";
  document.getElementById("qKH").value = "";
  stFilter = "all";
  doSearch();
}

function fmt(n){
  const v = Math.round((n || 0) * 100) / 100;
  return v % 1 === 0 ? String(v) : v.toFixed(2).replace(/0$/,"");
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function pctColor(pct){
  if(pct >= 100) return "green";
  if(pct >= 70) return "teal";
  if(pct >= 30) return "amber";
  return "red";
}
function pctTextClass(pct){
  if(pct >= 100) return "color:var(--green)";
  if(pct >= 70) return "color:var(--teal)";
  if(pct >= 30) return "color:var(--amber)";
  return "color:var(--red)";
}

function stageRow(name, sx, yc, unit){
  const has = yc > 0;
  const pct = has ? Math.round(Math.min(sx / yc * 100, 999)) : (sx > 0 ? 100 : 0);
  const displayPct = has ? (pct > 100 ? ">100" : pct) : (sx > 0 ? "—" : "");
  const barPct = Math.min(pct, 100);
  const color = has ? pctColor(pct) : (sx > 0 ? "teal" : "");

  const val = has
    ? fmt(sx) + ' / ' + fmt(yc) + ' <small>' + esc(unit) + '</small>'
    : (sx > 0 ? fmt(sx) + ' <small>' + esc(unit) + '</small>' : '<small style="color:#cbd5e1">—</small>');

  return '<div class="stage">' +
    '<span class="s-name">' + name + '</span>' +
    '<div class="s-bar"><div class="s-fill ' + color + '" style="width:' + barPct + '%"></div></div>' +
    '<span class="s-val">' + val + '</span>' +
    (displayPct !== "" ? '<span class="s-pct" style="' + pctTextClass(pct) + '">' + displayPct + '%</span>' : '<span class="s-pct"></span>') +
    '</div>';
}

function getStatus(e){
  const hasBTP = e.thoi.sx > 0 || e.in.sx > 0;
  const hasTP = e.slDone > 0 || e.klDone > 0;
  if(!hasBTP && !hasTP) return "chuasx";
  if(e.slYC > 0 && e.slDone >= e.slYC * 0.999) return "du";
  const ycCuoi = e.in.klyc > 0 ? e.in.klyc : e.thoi.klyc;
  if(ycCuoi > 0 && e.klDone >= ycCuoi * 0.999) return "du";
  if(e.slYC === 0 && e.klYC === 0 && hasTP) return "du";
  return "thieu";
}

/**
 * Bấm chip để lọc danh sách theo tình trạng.
 * Bấm lại chính chip đang chọn thì bỏ lọc, quay về xem tất cả.
 */
function setStFilter(ma){
  stFilter = (stFilter === ma) ? "all" : ma;
  render();
  // Cuộn lên đầu danh sách cho dễ nhìn
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function render(){
  // Dùng từ khóa ĐÃ ÁP DỤNG (đặt bởi doSearch), không đọc trực tiếp ô nhập —
  // để chữ đang gõ dở không ảnh hưởng khi bấm chip lọc tình trạng.
  const q   = qApplied;
  const qKH = qKHApplied;
  const listEl = document.getElementById("list");
  const chipsEl = document.getElementById("chips");

  let nDu = 0, nThieu = 0, nChuaSX = 0;
  data.forEach(e => {
    e._st = getStatus(e);
    if(e._st === "du") nDu++;
    else if(e._st === "thieu") nThieu++;
    else nChuaSX++;
  });

  chipsEl.style.display = "";
  const chip = (ma, cls, so, nhan) =>
    '<button type="button" class="chip ' + cls + (stFilter === ma ? ' on' : '') + '" ' +
      'onclick="setStFilter(\'' + ma + '\')">' + so + ' ' + nhan + '</button>';
  chipsEl.innerHTML =
    chip("all",    "total",  data.length, "LSX") +
    chip("du",     "du",     nDu,         "đủ") +
    chip("thieu",  "thieu",  nThieu,      "chưa đủ") +
    chip("chuasx", "chuasx", nChuaSX,     "chưa SX");

  let shown = data.filter(e => {
    // Lọc theo tình trạng khi người dùng bấm vào chip
    if(stFilter !== "all" && e._st !== stFilter) return false;
    // Ô LSX/Mã SP: tìm trong LSX + Mã SP + Mô tả + Chủng loại
    if(q){
      const haystack = (e.lsx + " " + e.lsxct + " " + e.masp + " " + e.mota + " " + e.cl).toLowerCase();
      if(!haystack.includes(q)) return false;
    }
    // Ô Khách hàng: tìm text trong tên KH
    if(qKH){
      if(!(e.kh || "").toLowerCase().includes(qKH)) return false;
    }
    return true;
  });

  const total = shown.length;
  const limited = total > CONFIG.RENDER_LIMIT;
  if(limited) shown = shown.slice(0, CONFIG.RENDER_LIMIT);

  if(total === 0){
    const NHAN = { du:"Đủ", thieu:"Chưa đủ", chuasx:"Chưa SX" };
    listEl.innerHTML = '<div class="empty">' +
      (stFilter === "all"
        ? 'Không có LSX nào khớp.'
        : 'Không có LSX nào thuộc nhóm "' + NHAN[stFilter] + '"' +
          (q || qKH ? ' với điều kiện tìm kiếm hiện tại' : '') + '.') +
      '</div>';
    return;
  }

  let html = "";
  shown.forEach(e => {
    let badge;
    if(e._st === "chuasx") badge = '<span class="badge b-none">Chưa SX</span>';
    else if(e._st === "du") badge = '<span class="badge b-du">Đủ</span>';
    else badge = '<span class="badge b-thieu">Chưa đủ</span>';

    let meta = [];
    if(e.masp) meta.push('SP: <b>' + esc(e.masp) + '</b>');
    if(e.mota) meta.push(esc(e.mota));
    if(e.cl) meta.push(esc(e.cl));
    if(e.ng) meta.push('Giao: <b>' + esc(e.ng) + '</b>');

    html += '<div class="card" onclick="openDetail(\'' + esc(e.lsx).replace(/'/g,"\\'") + '\')">' +
      '<div class="card-head">' +
        '<span class="c-lsx">' + esc(e.lsx) + '</span>' +
        (e.kh ? '<span class="c-kh">' + esc(e.kh) + '</span>' : '') +
        badge +
      '</div>' +
      (meta.length ? '<div class="c-meta">' + meta.join(' · ') + '</div>' : '') +
      '<div class="stages">' +
        stageRow("Thổi", e.thoi.sx, e.thoi.klyc, "kg") +
        stageRow("In", e.in.sx, e.in.klyc, "kg") +
        stageRow("TP (SL)", e.slDone, e.slYC, e.dvt || "cái") +
        stageRow("TP (KL)", e.klDone, e.klYC, "kg") +
      '</div>' +
      (e.ygh && e.ygh.length ? '<div class="ygh-row">Xuất: <b>' + e.ygh.map(esc).join(", ") + '</b></div>' : '') +
    '</div>';
  });

  if(limited){
    html += '<div class="more-note">Hiển thị ' + CONFIG.RENDER_LIMIT + '/' + total + ' — dùng ô tìm kiếm để lọc.</div>';
  }
  listEl.innerHTML = html;
}

/* ═══ MODAL CHI TIẾT ═══ */
function openModal(){
  document.getElementById("modalOverlay").classList.add("show");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modalOverlay").classList.remove("show");
  document.body.style.overflow = "";
}

async function openDetail(lsx){
  const mTitle = document.getElementById("mTitle");
  const mBody = document.getElementById("mBody");
  const item = data.find(e => e.lsx === lsx);

  mTitle.textContent = lsx;
  mBody.innerHTML = '<div class="det-loading"><span class="spin"></span> Đang tải chi tiết...</div>';
  openModal();

  // Load 2 nguồn song song từ CENTRAL_URL: lsxDetail (TP) + tksxHistory (Thổi/In)
  let tpData = null, tiData = null;
  try{
    const encLsx = encodeURIComponent(lsx);
    // SỬA 03/08/2026: fetch → JSONP, tránh GAS 302 redirect
    const [tp, ti] = await Promise.all([
      jsonp(CONFIG.CENTRAL_URL + "?action=lsxDetail&lsx=" + encLsx, CONFIG.TIMEOUT_DETAIL)
        .catch(() => null),
      jsonp(CONFIG.CENTRAL_URL + "?action=tksxHistory&lsx=" + encLsx, CONFIG.TIMEOUT_DETAIL)
        .catch(() => null)
    ]);
    tpData = tp;
    tiData = ti;
  }catch(e){}

  renderDetail(lsx, item, tpData, tiData);
}

function renderDetail(lsx, item, tpData, tiData){
  const mBody = document.getElementById("mBody");
  let html = "";

  // ── Info header ──
  if(item){
    let infoItems = [];
    if(item.kh) infoItems.push('KH: <b>' + esc(item.kh) + '</b>');
    if(item.masp) infoItems.push('SP: <b>' + esc(item.masp) + '</b>');
    if(item.mota) infoItems.push(esc(item.mota));
    if(item.ng) infoItems.push('Giao: <b>' + esc(item.ng) + '</b>');
    if(infoItems.length){
      html += '<div class="det-summary">' + infoItems.join(' · ') + '</div>';
    }
  }

  // ── THỔI (riêng) ──
  const tiRows = (tiData && tiData.rows) || [];
  const thoiRows = tiRows.filter(r => isThoi(r.loai));
  const inRows = tiRows.filter(r => !isThoi(r.loai));

  html += buildTISection("Thổi", thoiRows);
  html += buildTISection("In", inRows);

  // ── THÀNH PHẨM (Cắt/TC/GTB) ──
  const tpScans = (tpData && tpData.scans) || [];
  if(tpScans.length > 0){
    const wsGroups = {};
    tpScans.forEach(s => {
      const ws = mapWS(s.ws);
      if(!wsGroups[ws]) wsGroups[ws] = [];
      wsGroups[ws].push(s);
    });

    const wsOrder = ["Cắt/TC", "GTB", "Khác"];
    wsOrder.forEach(ws => {
      if(!wsGroups[ws]) return;
      html += buildTPSection(ws, wsGroups[ws]);
    });
  } else {
    html += '<div class="det-section"><div class="det-title">Thành phẩm</div><div class="det-empty">Chưa có dữ liệu thành phẩm</div></div>';
  }

  mBody.innerHTML = html;

  // Bind toggle events
  mBody.querySelectorAll(".det-day-head").forEach(el => {
    el.addEventListener("click", () => {
      el.parentElement.classList.toggle("open");
    });
  });
}

function mapWS(ws){
  const w = String(ws||"").toUpperCase();
  if(w === "CAT" || w === "TCO" || w === "CT") return "Cắt/TC";
  if(w === "GTB") return "GTB";
  if(!w) return "Khác";
  return w;
}

function buildTISection(label, rows){
  if(!rows.length){
    return '<div class="det-section"><div class="det-title">' + esc(label) + '</div><div class="det-empty">Chưa có dữ liệu ' + esc(label) + '</div></div>';
  }

  // Gom theo ngày SX
  const dayMap = {};
  let totalKG = 0, totalCuon = 0;
  const machineSet = {}, cnSet = {};

  rows.forEach(r => {
    const day = r.ngaySX || extractDate(r.time);
    if(!dayMap[day]) dayMap[day] = { kg:0, cuon:0, rows:[], machines:{}, cns:{} };
    const d = dayMap[day];
    d.kg += r.kqSX || 0;
    d.cuon++;
    d.rows.push(r);
    if(r.may) { d.machines[r.may] = true; machineSet[r.may] = true; }
    if(r.cn) { d.cns[r.cn] = true; cnSet[r.cn] = true; }
    totalKG += r.kqSX || 0;
    totalCuon++;
  });

  const days = Object.keys(dayMap).sort((a,b) => compareDateStr(b,a));

  let html = '<div class="det-section">';
  html += '<div class="det-title">' + esc(label) + ' <span class="dt-badge">' + totalCuon + ' cuộn · ' + fmt(totalKG) + ' kg</span></div>';
  html += '<div class="det-summary">' +
    'Máy: <b>' + (Object.keys(machineSet).join(", ") || "—") + '</b> · ' +
    'CN: <b>' + (Object.keys(cnSet).join(", ") || "—") + '</b>' +
    '</div>';

  days.forEach(day => {
    const d = dayMap[day];
    html += '<div class="det-day">' +
      '<div class="det-day-head">' +
        '<span class="dd-date">' + esc(day) + '</span>' +
        '<span class="dd-info">' + d.cuon + ' cuộn · ' + Object.keys(d.machines).join(", ") + '</span>' +
        '<span class="dd-kg">' + fmt(d.kg) + ' kg</span>' +
        '<span class="dd-arrow">&#9654;</span>' +
      '</div>' +
      '<div class="det-day-rows">';

    d.rows.forEach(r => {
      html += '<div class="det-row">' +
        '<span class="dr-time">' + extractTime(r.time) + '</span>' +
        '<span class="dr-cn">' + esc(r.cn) + '</span>' +
        '<span class="dr-may">' + esc(r.may) + '</span>' +
        '<span class="dr-val">' + fmt(r.kqSX) + ' kg</span>' +
        (r.klCuon ? '<span class="dr-cuon">(cuộn ' + fmt(r.klCuon) + ')</span>' : '') +
      '</div>';
    });

    html += '</div></div>';
  });

  html += '</div>';
  return html;
}

function buildTPSection(label, scans){
  const dayMap = {};
  let totalSL = 0, totalKG = 0;
  const machineSet = {}, cnSet = {};

  scans.forEach(s => {
    const day = extractDate(s.time);
    if(!dayMap[day]) dayMap[day] = { sl:0, kg:0, rows:[], machines:{}, cns:{} };
    const d = dayMap[day];
    d.sl += s.sl || 0;
    d.kg += s.klQR || 0;
    d.rows.push(s);
    if(s.mayTen || s.may) { const m = s.mayTen || s.may; d.machines[m] = true; machineSet[m] = true; }
    if(s.cnTen || s.cn) { const c = s.cnTen || s.cn; d.cns[c] = true; cnSet[c] = true; }
    totalSL += s.sl || 0;
    totalKG += s.klQR || 0;
  });

  const days = Object.keys(dayMap).sort((a,b) => compareDateStr(b,a));

  const titleLabel = label === "Khác" ? "Thành phẩm" : label;
  let html = '<div class="det-section">';
  html += '<div class="det-title">' + esc(titleLabel) + ' <span class="dt-badge">' + scans.length + ' lần · ' + fmt(totalSL) + ' SL · ' + fmt(totalKG) + ' kg</span></div>';
  html += '<div class="det-summary">' +
    'Máy: <b>' + (Object.keys(machineSet).join(", ") || "—") + '</b> · ' +
    'CN: <b>' + (Object.keys(cnSet).join(", ") || "—") + '</b>' +
    '</div>';

  days.forEach(day => {
    const d = dayMap[day];
    html += '<div class="det-day">' +
      '<div class="det-day-head">' +
        '<span class="dd-date">' + esc(day) + '</span>' +
        '<span class="dd-info">' + d.rows.length + ' lần · ' + Object.keys(d.machines).join(", ") + '</span>' +
        '<span class="dd-kg">' + fmt(d.sl) + ' SL · ' + fmt(d.kg) + ' kg</span>' +
        '<span class="dd-arrow">&#9654;</span>' +
      '</div>' +
      '<div class="det-day-rows">';

    d.rows.forEach(s => {
      html += '<div class="det-row">' +
        '<span class="dr-time">' + extractTime(s.time) + '</span>' +
        '<span class="dr-cn">' + esc(s.cnTen || s.cn || "") + '</span>' +
        '<span class="dr-may">' + esc(s.mayTen || s.may || "") + '</span>' +
        '<span class="dr-val">' + fmt(s.sl) + ' SL · ' + fmt(s.klQR) + ' kg</span>' +
      '</div>';
    });

    html += '</div></div>';
  });

  html += '</div>';
  return html;
}

/* ═══ Date helpers ═══ */
function extractDate(timeStr){
  const s = String(timeStr || "");
  const m1 = /^(\d{1,2}\/\d{1,2}\/\d{4})/.exec(s);
  if(m1) return m1[1];
  // yyyy-MM-dd → dd/MM/yyyy
  const m2 = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
  if(m2) return m2[3]+"/"+m2[2]+"/"+m2[1];
  return s.substring(0, 10);
}

function extractTime(timeStr){
  const s = String(timeStr || "");
  const m = /(\d{1,2}:\d{2})(:\d{2})?/.exec(s);
  return m ? m[1] : "";
}

function compareDateStr(a, b){
  const pa = parseDMY(a), pb = parseDMY(b);
  return pa - pb;
}

function parseDMY(s){
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s);
  if(!m) return 0;
  return new Date(parseInt(m[3]), parseInt(m[2])-1, parseInt(m[1])).getTime();
}
