<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0f766e" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Dashboard Bán hàng — QA-P.ERP</title>
<style>
:root{
  --teal:#0f766e; --teal-d:#0b5b54; --green:#16a34a; --red:#dc2626;
  --amber:#d97706; --blue:#2563eb; --purple:#7c3aed;
  --gray:#64748b; --bg:#f1f5f9; --card:#fff;
  --txt:#0f172a; --muted:#64748b; --border:#e2e8f0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:16px;line-height:1.4;}

.topbar{background:var(--teal);color:#fff;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;z-index:10;}
.topbar .ttl{font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px;}
.icon-btn{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;}

.tab-bar{display:flex;background:#fff;border-bottom:2px solid var(--border);position:sticky;top:48px;z-index:9;}
.tab-btn{flex:1;padding:12px 8px;text-align:center;font-size:13px;font-weight:600;color:var(--muted);border:0;background:none;cursor:pointer;border-bottom:3px solid transparent;transition:.2s;}
.tab-btn.active{color:var(--teal);border-bottom-color:var(--teal);}
.tab-content{display:none;padding:12px;}
.tab-content.active{display:block;}

.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
.filter-bar input[type="date"]{flex:1;min-width:120px;padding:10px;border:2px solid var(--border);border-radius:10px;font-size:15px;}
.btn-filter{padding:10px 16px;border:0;border-radius:10px;font-size:14px;font-weight:700;color:#fff;background:var(--teal);cursor:pointer;}
.quick-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.quick-btn{padding:6px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;cursor:pointer;background:#fff;color:var(--txt);font-weight:500;}
.quick-btn.active{background:var(--teal);color:#fff;border-color:var(--teal);}

/* ── matrix table ── */
.matrix-wrap{overflow-x:auto;margin-bottom:14px;}
.matrix{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.matrix th{background:var(--teal);color:#fff;padding:10px 8px;font-size:12px;text-align:center;white-space:nowrap;}
.matrix td{padding:10px 8px;font-size:14px;text-align:center;border-bottom:1px solid var(--border);}
.matrix tr:last-child td{border:0;}
.matrix .row-label{text-align:left;font-weight:600;color:var(--teal);white-space:nowrap;}
.matrix .row-total{background:#f0fdf4;font-weight:700;}
.matrix .row-total .row-label{color:var(--green);}

/* ── top KH per ngành ── */
.top-section{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:14px;}
.top-section .ts-title{font-size:14px;font-weight:700;color:var(--teal);margin-bottom:10px;}
.top-nganh{margin-bottom:10px;}
.top-nganh:last-child{margin-bottom:0;}
.top-nganh .tn-label{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px;}
.top-nganh .tn-list{font-size:13px;line-height:1.6;}
.top-nganh .tn-rank{display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--teal);color:#fff;text-align:center;line-height:20px;font-size:11px;font-weight:700;margin-right:4px;}
.top-nganh .tn-rank.r2{background:var(--blue);}
.top-nganh .tn-rank.r3{background:var(--gray);}

/* ── day table ── */
.day-table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.day-table th{background:var(--teal);color:#fff;padding:10px 8px;font-size:12px;text-align:center;}
.day-table td{padding:8px;font-size:13px;text-align:center;border-bottom:1px solid var(--border);}
.day-table tr:last-child td{border:0;}
.day-table .tfoot td{background:#f8fafc;font-weight:700;}

.loading{text-align:center;padding:40px;color:var(--muted);font-size:15px;}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:spin .6s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px;color:var(--muted);}
</style>
</head>
<body>

<div class="topbar">
  <div class="ttl">📊 Dashboard Bán hàng</div>
  <button class="icon-btn" onclick="location.href='index.html'">Menu</button>
</div>

<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('nhandon')">Nhận đơn hàng</button>
  <button class="tab-btn" onclick="switchTab('giaohang')">Sắp giao hàng</button>
</div>

<!-- ═══ TAB 1: NHẬN ĐƠN HÀNG ═══ -->
<div id="tab-nhandon" class="tab-content active">
  <div class="quick-btns" id="quickBtns1">
    <button class="quick-btn" onclick="quick1('today')">Hôm nay</button>
    <button class="quick-btn" onclick="quick1('week')">Tuần này</button>
    <button class="quick-btn active" onclick="quick1('month')">Tháng này</button>
    <button class="quick-btn" onclick="quick1('quarter')">Quý này</button>
  </div>
  <div class="filter-bar">
    <input type="date" id="from1" />
    <input type="date" id="to1" />
    <button class="btn-filter" onclick="loadTab1()">Lọc</button>
  </div>
  <div id="matrix1"></div>
  <div id="topKH1"></div>
  <div id="dayWrap1" style="overflow-x:auto;"></div>
  <div id="load1" class="loading" style="display:none;"><div class="spinner"></div>Đang tải dữ liệu...</div>
</div>

<!-- ═══ TAB 2: SẮP GIAO HÀNG ═══ -->
<div id="tab-giaohang" class="tab-content">
  <div class="quick-btns" id="quickBtns2">
    <button class="quick-btn" onclick="quick2('3d')">3 ngày</button>
    <button class="quick-btn active" onclick="quick2('7d')">7 ngày</button>
    <button class="quick-btn" onclick="quick2('30d')">30 ngày</button>
    <button class="quick-btn" onclick="quick2('60d')">60 ngày</button>
  </div>
  <div class="filter-bar">
    <input type="date" id="from2" />
    <input type="date" id="to2" />
    <button class="btn-filter" onclick="loadTab2()">Lọc</button>
  </div>
  <div id="matrix2"></div>
  <div id="load2" class="loading" style="display:none;"><div class="spinner"></div>Đang tải dữ liệu...</div>
</div>

<script>
const CONFIG = {
  BAN_HANG_URL: "https://script.google.com/macros/s/AKfycbyhCUKM79pBVfFt2JEKhyuA8vLT4gnSHiiApcRB5D4tdIraShM9ZaRSL-yd9oCMBGuVng/exec"
};

/* ═══ UTILS ═══ */
function toISO(d){ return d.toISOString().slice(0,10); }
function fmtNum(n){ return (n||0).toLocaleString("vi-VN"); }
function fmtKg(n){ return (n||0).toLocaleString("vi-VN",{maximumFractionDigits:1}); }
function fmtDate(iso){ if(!iso) return ""; const p=iso.split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }

/* ═══ TAB SWITCHING ═══ */
let tab2Loaded = false;
function switchTab(tab){
  document.querySelectorAll(".tab-btn").forEach((b,i)=>b.classList.toggle("active",(tab==="nhandon"&&i===0)||(tab==="giaohang"&&i===1)));
  document.getElementById("tab-nhandon").classList.toggle("active",tab==="nhandon");
  document.getElementById("tab-giaohang").classList.toggle("active",tab==="giaohang");
  if(tab==="giaohang" && !tab2Loaded){ quick2("7d"); tab2Loaded=true; }
}

/* ═══ QUICK FILTERS ═══ */
function getRange(period){
  const now=new Date(); let from,to;
  switch(period){
    case "today": from=to=toISO(now); break;
    case "week": { const d=now.getDay()||7; const m=new Date(now); m.setDate(now.getDate()-d+1); from=toISO(m); to=toISO(now); break; }
    case "month": from=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-01"; to=toISO(now); break;
    case "quarter": { const q=Math.floor(now.getMonth()/3); from=now.getFullYear()+"-"+String(q*3+1).padStart(2,"0")+"-01"; to=toISO(now); break; }
    case "3d":  from=toISO(now); to=toISO(new Date(now.getTime()+3*864e5)); break;
    case "7d":  from=toISO(now); to=toISO(new Date(now.getTime()+7*864e5)); break;
    case "30d": from=toISO(now); to=toISO(new Date(now.getTime()+30*864e5)); break;
    case "60d": from=toISO(now); to=toISO(new Date(now.getTime()+60*864e5)); break;
  }
  return {from,to};
}
function quick1(p){
  const r=getRange(p);
  document.getElementById("from1").value=r.from;
  document.getElementById("to1").value=r.to;
  document.querySelectorAll("#quickBtns1 .quick-btn").forEach(b=>b.classList.remove("active"));
  event.target.classList.add("active");
  loadTab1();
}
function quick2(p){
  const r=getRange(p);
  document.getElementById("from2").value=r.from;
  document.getElementById("to2").value=r.to;
  document.querySelectorAll("#quickBtns2 .quick-btn").forEach(b=>b.classList.remove("active"));
  event.target.classList.add("active");
  loadTab2();
}

/* ═══ FETCH HELPER ═══ */
async function callAPI(action, params){
  let url = CONFIG.BAN_HANG_URL + "?action=" + action + "&t=" + Date.now();
  for(const k in params) url += "&" + k + "=" + encodeURIComponent(params[k]);
  const res = await fetch(url);
  const json = await res.json();
  if(json.result !== "ok") throw new Error(json.error || "Lỗi không xác định");
  return json;
}

/* ═══ TAB 1: NHẬN ĐƠN HÀNG — gọi salesDashboard ═══ */
async function loadTab1(){
  const from = document.getElementById("from1").value;
  const to = document.getElementById("to1").value;
  if(!from || !to) return;

  document.getElementById("load1").style.display = "block";
  document.getElementById("matrix1").innerHTML = "";
  document.getElementById("topKH1").innerHTML = "";
  document.getElementById("dayWrap1").innerHTML = "";

  try {
    const json = await callAPI("salesDashboard", {from, to});
    renderTab1(json);
  } catch(e){
    document.getElementById("matrix1").innerHTML = '<div class="empty">Lỗi: '+e.message+'</div>';
  }
  document.getElementById("load1").style.display = "none";
}

function renderTab1(json){
  const s = json.summary || {};
  const bn = json.byNganh || {};
  const NGANHS = ["Nylon","Giấy","Khác"];

  // Lấy data per ngành, đảm bảo luôn có 3 ngành
  function ng(name){ return bn[name] || {don:0, kl:0, sl:0, soKH:0, topKH:[]}; }

  // ── Bảng ma trận ──
  let html = `<div class="matrix-wrap"><table class="matrix">
    <thead><tr><th>Chỉ tiêu</th><th>Tổng</th>`;
  NGANHS.forEach(n => html += `<th>${n}</th>`);
  html += `</tr></thead><tbody>`;

  // Row: Số đơn hàng
  html += `<tr><td class="row-label">Số đơn hàng</td><td><b>${fmtNum(s.tongDon)}</b></td>`;
  NGANHS.forEach(n => html += `<td>${fmtNum(ng(n).don)}</td>`);
  html += `</tr>`;

  // Row: Khối lượng
  html += `<tr><td class="row-label">Khối lượng (kg)</td><td><b>${fmtKg(s.tongKL)}</b></td>`;
  NGANHS.forEach(n => html += `<td>${fmtKg(ng(n).kl)}</td>`);
  html += `</tr>`;

  // Row: Số lượng
  html += `<tr><td class="row-label">Số lượng</td><td><b>${fmtNum(s.tongSL)}</b></td>`;
  NGANHS.forEach(n => html += `<td>${fmtNum(ng(n).sl)}</td>`);
  html += `</tr>`;

  // Row: Số khách hàng
  html += `<tr><td class="row-label">Số khách hàng</td><td><b>${fmtNum(s.soKH)}</b></td>`;
  NGANHS.forEach(n => html += `<td>${fmtNum(ng(n).soKH)}</td>`);
  html += `</tr>`;

  html += `</tbody></table></div>`;
  document.getElementById("matrix1").innerHTML = html;

  // ── Top 3 KH per ngành ──
  let topHTML = `<div class="top-section"><div class="ts-title">Top 3 khách hàng (theo khối lượng)</div>`;
  // Overall top
  const overallTop = json.topKH || [];
  topHTML += buildTopNganh("Tổng", overallTop);
  NGANHS.forEach(n => {
    const top = ng(n).topKH || [];
    if(top.length) topHTML += buildTopNganh(n, top);
  });
  topHTML += `</div>`;
  document.getElementById("topKH1").innerHTML = topHTML;

  // ── Bảng theo ngày ──
  const days = json.byDay || [];
  if(days.length){
    let tbl = `<table class="day-table"><thead><tr><th>Ngày</th><th>Số đơn</th><th>KL (kg)</th><th>Số lượng</th><th>Số KH</th></tr></thead><tbody>`;
    let tDon=0, tKL=0, tSL=0;
    days.forEach(d => {
      tDon+=d.don; tKL+=d.kl; tSL+=d.sl;
      tbl += `<tr><td>${fmtDate(d.ngay)}</td><td>${d.don}</td><td>${fmtKg(d.kl)}</td><td>${fmtNum(d.sl)}</td><td>${d.soKH}</td></tr>`;
    });
    tbl += `<tr class="tfoot"><td>Tổng</td><td>${tDon}</td><td>${fmtKg(tKL)}</td><td>${fmtNum(tSL)}</td><td>${s.soKH}</td></tr>`;
    tbl += `</tbody></table>`;
    document.getElementById("dayWrap1").innerHTML = tbl;
  }
}

function buildTopNganh(label, arr){
  if(!arr.length) return "";
  let h = `<div class="top-nganh"><div class="tn-label">${label}</div><div class="tn-list">`;
  arr.forEach((item,i) => {
    const cls = i===0?"":i===1?" r2":" r3";
    h += `<div><span class="tn-rank${cls}">${i+1}</span> ${item.kh||"(không tên)"} — ${fmtKg(item.kl)} kg</div>`;
  });
  h += `</div></div>`;
  return h;
}

/* ═══ TAB 2: SẮP GIAO HÀNG — gọi deliveryByRange ═══ */
async function loadTab2(){
  const from = document.getElementById("from2").value;
  const to = document.getElementById("to2").value;
  if(!from || !to) return;

  document.getElementById("load2").style.display = "block";
  document.getElementById("matrix2").innerHTML = "";

  try {
    const json = await callAPI("deliveryByRange", {from, to});
    renderTab2(json);
  } catch(e){
    document.getElementById("matrix2").innerHTML = '<div class="empty">Lỗi: '+e.message+'</div>';
  }
  document.getElementById("load2").style.display = "none";
}

function renderTab2(json){
  const sm = json.summary || {};
  const bn = json.byNganh || {};
  const NGANHS = ["Nylon","Giấy","Khác"];
  function ng(name){ return bn[name] || {don:0, kl:0, sl:0, soKH:0}; }

  // Hiển thị khoảng ngày
  let period = "";
  if(json.from && json.to) period = `<div style="text-align:center;font-size:13px;color:var(--muted);margin-bottom:10px;">Từ ${fmtDate(json.from)} đến ${fmtDate(json.to)}</div>`;

  // Bảng ma trận 5 cột × 4 hàng
  let html = period + `<div class="matrix-wrap"><table class="matrix">
    <thead><tr><th>Ngành hàng</th><th>Số KH</th><th>Số đơn hàng</th><th>Số lượng</th><th>Khối lượng (kg)</th></tr></thead><tbody>`;

  NGANHS.forEach(n => {
    const d = ng(n);
    html += `<tr><td class="row-label">${n}</td><td>${fmtNum(d.soKH)}</td><td>${fmtNum(d.don)}</td><td>${fmtNum(d.sl)}</td><td>${fmtKg(d.kl)}</td></tr>`;
  });

  // Hàng tổng
  html += `<tr class="row-total"><td class="row-label">Tổng cộng</td><td><b>${fmtNum(sm.soKH)}</b></td><td><b>${fmtNum(sm.don)}</b></td><td><b>${fmtNum(sm.sl)}</b></td><td><b>${fmtKg(sm.kl)}</b></td></tr>`;
  html += `</tbody></table></div>`;

  if(!sm.don) html += '<div class="empty">Không có đơn hàng nào trong khoảng thời gian này.</div>';

  document.getElementById("matrix2").innerHTML = html;
}

/* ═══ INIT ═══ */
window.addEventListener("DOMContentLoaded", () => {
  const params = new URLSearchParams(location.search);
  const tab = params.get("tab");
  if(tab === "giaohang"){
    switchTab("giaohang");
  } else {
    quick1("month");
  }
});
</script>
</body>
</html>
